<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DiaCare – Smart Diabetes Management</title>
  <meta name="description" content="DiaCare is a smart diabetes management app to track blood sugar, medicines, food, snacks, and water intake with role-based access for patients, caretakers, and doctors." />

  <!-- PWA / Mobile -->
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DiaCare" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.json" />

  <!-- App Icons -->
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Preconnect for speed -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

  <!-- Critical CSS inlined: prevents white flash on load -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      background:#f8fafc;color:#1e293b;
      min-height:100vh;min-height:100dvh;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }
    #app{position:relative;z-index:1}
    /* Loading splash screen */
    #splash{
      position:fixed;inset:0;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:16px;background:#ffffff;z-index:9999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    #splash.fade-out { opacity: 0; visibility: hidden; }
    #splash-logo{
      width:72px;height:72px;border-radius:20px;
      background:linear-gradient(135deg,#2563eb,#3b82f6);
      display:flex;align-items:center;justify-content:center;
      font-size:36px;
      box-shadow:0 10px 25px rgba(37,99,235,0.2);
    }
    #splash-title{
      font-size:1.8rem;font-weight:700;letter-spacing:-.02em;
      color:#1e293b;
    }
    #splash-spinner{
      width:32px;height:32px;
      border:3px solid rgba(37,99,235,0.1);
      border-top-color:#2563eb;
      border-radius:50%;
      animation:sp .6s linear infinite;
    }
    @keyframes sp{to{transform:rotate(360deg)}}
    #splash p{color:#64748b;font-size:0.9rem;font-weight:500}
  </style>

  <!-- Fonts (non-blocking) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" /></noscript>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Inline splash screen shown before JS/CSS loads (no flash of unstyled content) -->
  <div id="splash">
    <div id="splash-logo">🩺</div>
    <div id="splash-title">DiaCare</div>
    <div id="splash-spinner"></div>
    <p>Loading your health data…</p>
  </div>

  <div id="app"></div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>

  <script src="app.js" defer></script>
</body>
</html>
